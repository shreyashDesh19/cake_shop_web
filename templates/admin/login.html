<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login – Sweet Cravings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
</head>
<body style="background:linear-gradient(135deg,var(--dark-brown),var(--brown));min-height:100vh;
             display:flex;align-items:center;justify-content:center;">

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;width:400px;">
    {% for cat, msg in messages %}
    <div class="alert alert-{{ 'danger' if cat=='danger' else 'success' if cat=='success' else 'info' }}
                alert-dismissible fade show alert-auto-dismiss">
      {{ msg }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}

<div class="form-card" style="max-width:420px;width:90%;">
  <div class="text-center mb-4">
    <div style="font-size:2.5rem;">🛡️</div>
    <h3 style="color:var(--dark-brown);font-family:'Playfair Display',serif;">Admin Login</h3>
    <p class="text-muted" style="font-size:0.9rem;">Sweet Cravings Admin Panel</p>
  </div>

  <form action="{{ url_for('admin_login') }}" method="POST">

    <div class="mb-3">
      <label class="form-label">Username</label>
      <div class="input-group">
        <span class="input-group-text"
              style="border-color:#f0ddd6;background:var(--light-pink);">
          <i class="bi bi-person-badge" style="color:var(--brown)"></i>
        </span>
        <input type="text" name="username" class="form-control"
               placeholder="Admin username" required autofocus>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text"
              style="border-color:#f0ddd6;background:var(--light-pink);">
          <i class="bi bi-lock" style="color:var(--brown)"></i>
        </span>
        <input type="password" name="password" id="adminpwd"
               class="form-control" placeholder="Admin password" required>
        <button class="btn btn-outline-secondary" type="button"
                onclick="togglePwd('adminpwd', this)">
          <i class="bi bi-eye"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn-brown w-100 btn-lg">
      <i class="bi bi-shield-lock me-2"></i>Login as Admin
    </button>

  </form>

  <p class="text-center mt-3 mb-0">
    <a href="{{ url_for('index') }}" class="text-muted" style="font-size:0.85rem;">
      <i class="bi bi-arrow-left me-1"></i>Back to Website
    </a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
  function togglePwd(id, btn) {
    const inp = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (inp.type === 'password') { inp.type = 'text'; icon.classList.replace('bi-eye','bi-eye-slash'); }
    else { inp.type = 'password'; icon.classList.replace('bi-eye-slash','bi-eye'); }
  }
</script>
</body>
</html>
