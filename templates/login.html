{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}

<section class="py-5" style="min-height:80vh;background:#f8f0ec;">
  <div class="container">
    <div class="form-card">

      <div class="text-center mb-4">
        <div style="font-size:3rem;">🎂</div>
        <h2 style="color:var(--dark-brown);font-family:'Playfair Display',serif;">Welcome Back!</h2>
        <p class="text-muted">Sign in to your Sweet Cravings account</p>
      </div>

      <form action="{{ url_for('login') }}" method="POST" novalidate>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text" style="border-color:#f0ddd6;background:var(--light-pink);">
              <i class="bi bi-envelope" style="color:var(--brown)"></i>
            </span>
            <input type="email" name="email" class="form-control"
                   placeholder="you@example.com" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text" style="border-color:#f0ddd6;background:var(--light-pink);">
              <i class="bi bi-lock" style="color:var(--brown)"></i>
            </span>
            <input type="password" name="password" id="password"
                   class="form-control" placeholder="Enter your password" required>
            <button class="btn btn-outline-secondary" type="button"
                    onclick="togglePwd('password', this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 btn-lg">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>

      </form>

      <hr class="my-4">

      <p class="text-center text-muted mb-0">
        Don't have an account?
        <a href="{{ url_for('register') }}" style="color:var(--brown);font-weight:600;">
          Register here
        </a>
      </p>

      <p class="text-center mt-2">
        <small>
          <a href="{{ url_for('admin_login') }}" class="text-muted">
            <i class="bi bi-shield-lock me-1"></i>Admin Login
          </a>
        </small>
      </p>

    </div>
  </div>
</section>

{% block extra_js %}
<script>
  function togglePwd(id, btn) {
    const inp = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
      inp.type = 'password';
      icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
  }
</script>
{% endblock %}

{% endblock %}
